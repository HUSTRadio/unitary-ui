name: Motion browser regression

on:
  schedule:
    # UTC 18:00 = Asia/Shanghai 02:00
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motion-browsers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  motion:
    name: Chromium / Firefox / WebKit motion
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Check complete motion matrix
        id: audit
        run: pnpm run test:motion
      - name: Preserve motion evidence
        if: ${{ !cancelled() && steps.audit.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: motion-browser-evidence
          path: |
            .scratch/motion-browsers/run-*/summary.json
            .scratch/motion-browsers/run-*/expected.json
            .scratch/motion-browsers/run-*/results.json
            .scratch/motion-browsers/run-*/results
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
