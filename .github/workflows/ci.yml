name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint / Typecheck / Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # changelog-contract 测试需要 git tags 对照，fetch-depth 必须为 0
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # tsc -b：src/ + 配置（strict），与 build 同源
      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck tests and docs
        run: pnpm run typecheck:tests

      - name: Typecheck dynamic templates
        run: pnpm run typecheck:templates

      - name: Setup Python for audit tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/audit/requirements.txt

      - name: Install audit image dependencies
        run: python -m pip install --requirement tests/audit/requirements.txt

      - name: Unit tests
        run: pnpm run test

  build-package:
    name: Application build / Package contracts
    # Match the full browser audit, including the unchanged material frame budget.
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # test:package 在打包后的 docs 消费端跑 docs-layout，其中 glass-stability.spec.ts
      # 会真实 launch Firefox/WebKit；只装 Chromium 会让该步骤报 "Executable doesn't exist"。
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build application
        run: pnpm run build

      # test:package rebuilds the library and checks SSR/imports and published CSS,
      # including the docs-layout matrix on the packaged consumer (real engine legs).
      - name: Verify package contracts
        run: pnpm run test:package

      - name: Build template consumers
        run: pnpm run build:templates

      - name: Verify copied template package consumers
        run: pnpm run test:templates:package

      - name: Verify template layouts and interactions
        run: pnpm run test:templates

      - name: Upload template browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: template-browser-evidence
          path: |
            .scratch/template-browser.json
            .scratch/template-playwright-results
            .scratch/template-package
          retention-days: 7
          include-hidden-files: true

  docs:
    name: Documentation build / Corpus consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build documentation
        run: pnpm run build:docs

      - name: Check deterministic bilingual corpus
        run: pnpm run docs:llm:check

      - name: Verify website layouts and interactions
        run: pnpm run test:website -- --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .scratch/website-browser.json

      - name: Upload website browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: website-browser-evidence
          path: |
            .scratch/website-browser.json
            .scratch/website-playwright-results
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn
