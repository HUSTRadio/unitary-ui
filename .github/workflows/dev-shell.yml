name: Dev Shell

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-shell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dev-shell:
    name: Contract / Server / Web / Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck contract, server and web
        run: pnpm run typecheck:dev-shell

      - name: Run real database, server and web unit tests with fake CLI fixtures
        run: pnpm run test:dev-shell

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web
        run: pnpm run build:dev-shell

      - name: Run browser integration with fake CLI fixtures
        run: pnpm run test:dev-shell:e2e

  dev-shell-windows:
    name: Windows CLI resolution and process lifecycle
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck contract, server and web
        run: pnpm run typecheck:dev-shell

      - name: Verify Windows shim resolution, protected MCP config and process-tree cancellation with fake CLI
        run: pnpm run test:dev-shell
