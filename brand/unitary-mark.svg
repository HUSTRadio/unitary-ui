<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="unitary-mark-title">
  <title id="unitary-mark-title">Unitary mark</title>
  <!--
    图形框（mark box）：768 × 768，居中于 1024 画布，四边留白 128（12.5%）。
    画布与留白遵循 Apple HIG App icons：1024 工作画布、内容居中，
    四角终端避开 iOS 圆角遮罩（r ≈ 22.37%，遮罩对角线裁切点约在 (67, 67)）。

    框内局部坐标 0 → 768：
      A(0, 0)            左上角，上臂起点
      V(764.96, 384)     双臂中线交汇点
      B(0, 768)          左下角，下臂终点
      弦 A→V：弦长 855.93，弦角 26.656°
      圆弧：矢高 73.20，朝左下方（即朝框内开口一侧）凸起，
            圆半径 R = 弦长² / (8 × 矢高) + 矢高 / 2 = 1287.63
      对称：下臂为上臂关于 y = 384 的镜像；镜像与路径反向各翻转一次 sweep，
            相互抵消，故两段弧 sweep-flag 同为 0。
      描边宽 w = 96 = 768 / 8，全程恒定。

    ▸ 三条互相耦合的硬约束（本文件的解同时满足）：
      (1) 终端裁切：左上/左下被框裁出的直角，两条边长相等
      (2) 右缘切面高度 = 描边宽度 w
      (3) 单段圆弧
    约束(1)：上边裁切面 = 外偏移圆(R−w/2)与 y=0 的交点，左边 = 内偏移圆(R+w/2)与 x=0 的交点，
             两者相等需精确联立（局部直线近似会差 2.4）：
               上 = R·sinθ_A − √((R−w/2)² − (R·cosθ_A)²)
               左 = √((R+w/2)² − (R·sinθ_A)²) − R·cosθ_A
             解得 θ_A = 46.069°（略大于 45°，正是圆弧曲率的补偿）。
    约束(2)：face = 2[(w/2)/cosθ_V − D·tanθ_V] = w  ⇒  D = (w/2)·tan(θ_V/2)，
             解得 D = 3.038（Vx = 764.96），face = 96.000 = w。
    约束(3) 使上述两条把 θ_A 与 D 锁死，进而定出半转角 19.413°、矢高 73.20。

    ▸ 取舍（已知且必须保留说明）：
      拐角等长 + 切面 = w 会把总量转角推到 38.83°，单段圆弧下矢高只能到 73.20
      （旧版 46.08 对应 θ_A = 39.08°、两边 76.2 / 61.8，不等长）。
      即：**在单圆弧前提下，"两边等长"与"更平缓的弯度"不可兼得**。
      若日后要回到 ~46 的矢高又保留等长，需把臂改为椭圆弧/三次曲线（不再是单圆弧）。

    参考对照：
      旧版 Vx=761.93, R=1997.85, 矢高 46.08 → 拐角 76.2 / 61.8（不等长），右缘切面 96
      本版 Vx=764.96, R=1287.63, 矢高 73.20 → 拐角 67.894 / 67.894（等长），右缘切面 96
      内凹口 x ≈ 537.1

    stroke-miterlimit 设为 12：本例 miter 比值 = 1 / sin 7.2435° ≈ 7.93，
    已高于默认上限 4 且接近 8，故取 12 以保证 miter 不被降级（即便降级，
    bevel 边落在 x ≈ 771，仍在框外，被裁切后观感一致）。
  -->
  <defs>
    <clipPath id="unitary-mark-box">
      <rect x="128" y="128" width="768" height="768" />
    </clipPath>
  </defs>
  <g clip-path="url(#unitary-mark-box)">
    <g transform="translate(128 128)">
      <path
        d="M 0 0 A 1287.63 1287.63 0 0 0 764.96 384 A 1287.63 1287.63 0 0 0 0 768"
        fill="none"
        stroke="#0D47A1"
        stroke-width="96"
        stroke-linecap="butt"
        stroke-linejoin="miter"
        stroke-miterlimit="12"
      />
    </g>
  </g>
</svg>
