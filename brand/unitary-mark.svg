<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="unitary-mark-title">
  <title id="unitary-mark-title">Unitary mark</title>
  <!--
    ［字体字形版］品牌符号 = D-DIN Pro Exp Bold 的 ">"（U+003E）字形轮廓（OFL-1.1）。
    历史版本：弧线描边 w=165.888 见 git f5f03a9。

    图形框（mark box）：768 × 768，居中于 1024 画布，四边留白 128（12.5%）。
    画布与留白遵循 Apple HIG App icons：1024 工作画布、内容居中，
    四角终端避开 iOS 圆角遮罩（r ≈ 22.37%，遮罩对角线裁切点约在 (67, 67)）。

    字形取用（本资产 = 把字形拟合进图形框）：
      字符：">"（U+003E，glyph index 34）
      字体：D-DIN Pro Exp Bold —— 与横版字标 "Unitary" 同字体、同字重
      拟合：等轴缩放（不拉伸字形），font-size = 1737.557，墨迹最长边 = 768
      墨迹：750.62 × 768，居中于框 —— x 8.69 → 759.31，y 0 → 768
      颜色：#0D47A1；轮廓为字体原生 1 条闭合路径（6 点），坐标保留 2 位小数

    ▸ 与横版 Logo 的分工（同一字形，仅容器缩放不同）：
      本资产与 app-icon 把字形拟合到图形框（应用图标 / 独立标记场景）；
      横版 Logo 中 mark 则与 "Unitary" 同字号排布：F = 289.8551（cap 200）、
      基线 y = 0、笔位 x = 110.87、墨迹 125.22 × 128.12、间距 100。
      两处字形来源完全一致，详见 unitary-logo-horizontal.svg 的注释。

    ▸ 字形自带笔画厚度（不可独立调节）：
      斜臂法向厚度 ≈ 186（框内单位）= 0.1045 em；在横版同字号排布下为 30.29px，
      而字标主干实测 36px —— 同一字号、同一字重下 ">" 天然比竖笔细约 16%，
      这是字体自身设计，不拉伸字形就无法改变。
      若需更粗的 ">"：同字体 800 ExtraBold 在同字号下臂厚 34.0px（仍不等于 36）。

    ▸ 原描边几何（已作废）：
      三条互相耦合的硬约束 —— (1) 拐角两裁切边等长、(2) 右缘切面 = 描边宽 w、
      (3) 单段圆弧 —— 在字形版中不再适用，也不再需要联立求解；形状由字体设计决定。

    ▸ clipPath 说明：
      字形完全落在 768 框内（不溢出），框裁切实际为 no-op；保留 defs/clipPath 与
      translate(128 128) 结构，使引用 id、结构与尺寸口径与历史版本一致。

    参考对照（描边版历史，便于回退比较）：
      旧版 Vx=761.93, R=1997.85, 矢高 46.08 → 拐角 76.2 / 61.8（不等长），右缘切面 96
      w=96: Vx=764.96, R=1287.63, 矢高 73.20 → 拐角 67.894 / 67.894（等长），右缘切面 96，凹口 x ≈ 537.09
      w=107.52: Vx=764.65, R=1279.17, 矢高 73.67 → 拐角 76.045 / 76.045（等长），右缘切面 107.52，凹口 x ≈ 516.38
      w=128: Vx=764.14, R=1264.09, 矢高 74.52 → 拐角 90.539 / 90.539（等长），右缘切面 128，凹口 x ≈ 481.44
      w=165.888（已提交 f5f03a9）: Vx=763.30, R=1236.09, 矢高 76.18 → 拐角 117.367 / 117.367（等长），右缘切面 165.888，凹口 x ≈ 421.86
      直臂版: V=(763.30, 384) 直线双臂，θ_V=26.706°，拐角 184.56 / 92.85（不等长），右缘切面 180.97，凹口 x ≈ 578.74
  -->
  <defs>
    <clipPath id="unitary-mark-box">
      <rect x="128" y="128" width="768" height="768" />
    </clipPath>
  </defs>
  <g clip-path="url(#unitary-mark-box)">
    <g transform="translate(128 128)">
      <path
        d="M8.69 768L8.69 566.44L491.73 384L8.69 199.82L8.69 0L759.31 293.65L759.31 472.62Z"
        fill="#0D47A1"
      />
    </g>
  </g>
</svg>
