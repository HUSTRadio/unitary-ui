<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="unitary-mark-title">
  <title id="unitary-mark-title">Unitary mark</title>
  <!--
    图形框（mark box）：768 × 768，居中于 1024 画布，四边留白 128（12.5%）。
    画布与留白遵循 Apple HIG App icons：1024 工作画布、内容居中，
    四角终端避开 iOS 圆角遮罩（r ≈ 22.37%，遮罩对角线裁切点约在 (67, 67)）。

    框内局部坐标 0 → 768：
      A(0, 0)            左上角，上臂起点
      V(763.30, 384)     双臂中线交汇点
      B(0, 768)          左下角，下臂终点
      弦 A→V：弦长 854.45，弦角 26.706°
      圆弧：矢高 76.18，朝左下方（即朝框内开口一侧）凸起，
            圆半径 R = 弦长² / (8 × 矢高) + 矢高 / 2 = 1236.09
      对称：下臂为上臂关于 y = 384 的镜像；镜像与路径反向各翻转一次 sweep，
            相互抵消，故两段弧 sweep-flag 同为 0。
      描边宽 w = 165.888，标定依据为「文字主干的 1.5 倍」：
            横版 Logo 中 "Unitary" 主干实测 36px（x-height 区段众数，cap 200），
            mark 墨迹高固定 250px，比例 768/250 = 3.072，
            故 w = 1.5 × 36 × 3.072 = 165.888，换算回横版即 54px = 文字主干 × 1.5。
            占图形框 0.216（= 27/125），全程恒定。

    ▸ 三条互相耦合的硬约束（本文件的解同时满足）：
      (1) 终端裁切：左上/左下被框裁出的直角，两条边长相等
      (2) 右缘切面高度 = 描边宽度 w
      (3) 单段圆弧
    约束(1)：上边裁切面 = 外偏移圆(R−w/2)与 y=0 的交点，左边 = 内偏移圆(R+w/2)与 x=0 的交点，
             两者相等需精确联立（局部直线近似会差 2.4）：
               上 = R·sinθ_A − √((R−w/2)² − (R·cosθ_A)²)
               左 = √((R+w/2)² − (R·sinθ_A)²) − R·cosθ_A
             解得 θ_A = 46.9259°（略大于 45°，正是圆弧曲率的补偿），两边同长 117.367。
    约束(2)：face = 2[(w/2)/cosθ_V − D·tanθ_V] = w  ⇒  D = (w/2)·tan(θ_V/2)，
             解得 D = 4.70（Vx = 763.30），face = 165.888 = w。
    约束(3) 使上述两条把 θ_A 与 D 锁死，进而定出半转角 20.22°、矢高 76.18。

    ▸ 取舍（已知且必须保留说明）：
      拐角等长 + 切面 = w 会把总量转角推到约 40.44°，单段圆弧下矢高被定死：
      描边越粗 → θ_V 越小、矢高越大、凹口越深、拐角裁切越长。
      本版取 1.5 倍（w = 165.888）：凹口尖端 x ≈ 421.86、拐角裁切边长 117.367（占框 15.3%）、
      miter 比值 8.853（低于 miterlimit 12）。
      更粗的 2 倍档（w = 221.184，凹口 x ≈ 343.69、miter 9.885）已试并放弃；
      更细的档位见下方参考对照。
      即：**在单圆弧前提下，"两边等长"与"更平缓的弯度"不可兼得**；
      若日后要回到更平缓的弯度又保留等长，需把臂改为椭圆弧/三次曲线（不再是单圆弧）。

    参考对照：
      旧版 Vx=761.93, R=1997.85, 矢高 46.08 → 拐角 76.2 / 61.8（不等长），右缘切面 96
      前版 w=96: Vx=764.96, R=1287.63, 矢高 73.20 → 拐角 67.894 / 67.894（等长），右缘切面 96，凹口 x ≈ 537.09
      前版 w=107.52: Vx=764.65, R=1279.17, 矢高 73.67 → 拐角 76.045 / 76.045（等长），右缘切面 107.52，凹口 x ≈ 516.38
      前版 w=128: Vx=764.14, R=1264.09, 矢高 74.52 → 拐角 90.539 / 90.539（等长），右缘切面 128，凹口 x ≈ 481.44
      前版 w=192: Vx=762.82, R=1216.70, 矢高 77.39 → 拐角 135.871 / 135.871（等长），右缘切面 192，凹口 x ≈ 383.84
      试作 w=221.184: Vx=762.39, R=1194.95, 矢高 78.83 → 拐角 156.57 / 156.57（等长），右缘切面 221.184，凹口 x ≈ 343.69（过粗，弃用）
      本版 w=165.888: Vx=763.30, R=1236.09, 矢高 76.18 → 拐角 117.367 / 117.367（等长），右缘切面 165.888，凹口 x ≈ 421.86

    stroke-miterlimit 设为 12：本例 miter 比值 = 1 / sin 6.486° ≈ 8.853，
    已高于默认上限 4，故取 12 以保证 miter 不被降级
    （miter 顶点落在 x ≈ 1498，远在框外；即便降级为 bevel，bevel 边落在 x ≈ 773，
    同样在框外，被框裁切后观感一致）。
  -->
  <defs>
    <clipPath id="unitary-mark-box">
      <rect x="128" y="128" width="768" height="768" />
    </clipPath>
  </defs>
  <g clip-path="url(#unitary-mark-box)">
    <g transform="translate(128 128)">
      <path
        d="M 0 0 A 1236.09 1236.09 0 0 0 763.3 384 A 1236.09 1236.09 0 0 0 0 768"
        fill="none"
        stroke="#0D47A1"
        stroke-width="165.888"
        stroke-linecap="butt"
        stroke-linejoin="miter"
        stroke-miterlimit="12"
      />
    </g>
  </g>
</svg>
