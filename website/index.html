<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Create the One. Explore Unitary UI through real components, themes, materials, and motion." />
    <title>Unitary — Create the One.</title>
    <script>
      // Match ThemeProvider before the first paint, including storage failures.
      (function () {
        var preference = "system";
        try {
          var stored = localStorage.getItem("unitary-theme-preference") || localStorage.getItem("geist-theme-preference");
          if (stored === "light" || stored === "dark" || stored === "system") preference = stored;
        } catch (e) {}
        var dark = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0a0a0a" : "#ffffff";
      })();
    </script>
    <script>
      // Texture is independent of color preference, including storage failures.
      (function () {
        var texture = "solid";
        try {
          var stored = localStorage.getItem("unitary-texture-preference-v2");
          if (stored === "solid" || stored === "acrylic" || stored === "aero" || stored === "glass") texture = stored;
          else {
            var legacy = localStorage.getItem("unitary-texture-preference");
            var migrated = legacy === "hybrid" ? "acrylic" : legacy === "glass" ? "aero" : legacy === "solid" ? "solid" : null;
            if (migrated) {
              texture = migrated;
              try { localStorage.setItem("unitary-texture-preference-v2", migrated); } catch (e) {}
            }
          }
        } catch (e) {}
        var supported = false;
        try {
          supported =
            (CSS.supports("backdrop-filter", "blur(1px)") ||
              CSS.supports("-webkit-backdrop-filter", "blur(1px)")) &&
            CSS.supports("color", "color-mix(in srgb, white 50%, transparent)") &&
            !matchMedia("(forced-colors: active)").matches &&
            !matchMedia("(prefers-reduced-transparency: reduce)").matches;
        } catch (e) {}
        document.documentElement.dataset.texturePreference = texture;
        document.documentElement.dataset.texture = supported ? texture : "solid";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
